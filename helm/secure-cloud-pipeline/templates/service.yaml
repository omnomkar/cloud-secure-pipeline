apiVersion: v1
kind: Service
metadata:
  name: {{ include "secure-cloud-pipeline.fullname" . }}
  labels:
    {{- include "secure-cloud-pipeline.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "secure-cloud-pipeline.selectorLabels" . | nindent 4 }}
