# Replaces Terraform/manual creation of ecr-pull-secret: a one-time
# `kubectl create secret` would depend on the SSM port-forward tunnel and
# KUBECONFIG being active at the exact moment `terraform apply` runs, and
# wouldn't solve the real problem anyway - ECR tokens expire after ~12h,
# so anything that only ever creates the secret once will start failing
# image pulls again well within a day. This CronJob re-creates it on a
# schedule from inside the cluster instead.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "secure-cloud-pipeline.fullname" . | trunc 40 | trimSuffix "-" }}-ecr-refresh
  labels:
    {{- include "secure-cloud-pipeline.labels" . | nindent 4 }}
spec:
  # Every 6 hours - comfortably inside the ~12h ECR token lifetime, leaving
  # margin so a single missed/delayed run doesn't let the secret go stale.
  schedule: "0 */6 * * *"
  concurrencyPolicy: Replace
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          # Deliberately NOT secure-cloud-pipeline.selectorLabels - that's
          # the exact label set service.yaml's Service selects on for the
          # app Deployment's pods. Reusing it here would make a running
          # ecr-refresh job's pod match that Service's selector too, and
          # it has no port 5000 listener to receive that traffic.
          labels:
            app.kubernetes.io/name: {{ include "secure-cloud-pipeline.name" . }}-ecr-refresh
            app.kubernetes.io/instance: {{ .Release.Name }}
        spec:
          serviceAccountName: {{ include "secure-cloud-pipeline.fullname" . | trunc 40 | trimSuffix "-" }}-ecr-refresh
          restartPolicy: OnFailure
          containers:
            - name: ecr-pull-secret-refresh
              image: "public.ecr.aws/aws-cli/aws-cli:2.17.62"
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -euo pipefail

                  # kubectl isn't part of the aws-cli image, so it's fetched
                  # at runtime - the same "curl the official binary on
                  # demand" pattern .github/workflows/deploy.yml uses to
                  # bootstrap Helm on the node, rather than maintaining and
                  # publishing a custom image just to bundle two CLIs.
                  KUBECTL_VERSION="$(curl -fsSL https://dl.k8s.io/release/stable.txt)"
                  curl -fsSL -o /usr/local/bin/kubectl \
                    "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
                  chmod +x /usr/local/bin/kubectl

                  # This is a single-node cluster, so this pod runs on the
                  # same EC2 instance whose IAM role already has
                  # ecr:GetAuthorizationToken (Phase 3,
                  # live/k3s_instance.tf aws_iam_role_policy.k3s_instance_ecr,
                  # Resource "*" - the only AWS action get-login-password
                  # calls). The AWS CLI's default credential chain reaches
                  # that role over IMDS exactly like the app's boto3 calls
                  # do - both depend on
                  # metadata_options.http_put_response_hop_limit = 2 (also
                  # Phase 3/5) to cross the one extra host-to-pod network
                  # hop. No new IAM permission and no AWS credential Secret
                  # are needed here at all.
                  TOKEN="$(aws ecr get-login-password --region "{{ .Values.awsRegion }}")"

                  # image.repository is always set to "<registry>/<repo>"
                  # (see .github/workflows/deploy.yml's --set image.repository)
                  # - the registry host is everything before the first "/".
                  IMAGE_REPOSITORY="{{ .Values.image.repository }}"
                  REGISTRY="${IMAGE_REPOSITORY%%/*}"

                  # kubectl auto-detects in-cluster config from this pod's
                  # mounted ServiceAccount token - no kubeconfig file and no
                  # /etc/rancher/k3s/k3s.yaml needed in here, unlike the
                  # SSM deploy script which runs directly on the host.
                  # dry-run+apply makes this idempotent: it overwrites the
                  # secret in place on every run instead of failing because
                  # it already exists - including the very first run after
                  # this chart replaces a manually-created ecr-pull-secret
                  # from before this CronJob existed.
                  kubectl create secret docker-registry ecr-pull-secret \
                    --docker-server="${REGISTRY}" \
                    --docker-username=AWS \
                    --docker-password="${TOKEN}" \
                    --namespace="{{ .Release.Namespace }}" \
                    --dry-run=client -o yaml | kubectl apply -f -
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 100m
                  memory: 128Mi
