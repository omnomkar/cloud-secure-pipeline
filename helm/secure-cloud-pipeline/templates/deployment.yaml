apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "secure-cloud-pipeline.fullname" . }}
  labels:
    {{- include "secure-cloud-pipeline.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "secure-cloud-pipeline.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "secure-cloud-pipeline.selectorLabels" . | nindent 8 }}
    spec:
      # imagePullSecrets: self-managed clusters (k3s here) don't get the
      # automatic IAM-role-based ECR auth that EKS provides - that's an
      # EKS-specific integration, not a general Kubernetes feature. This
      # secret holds a short-lived ECR token instead (expires ~12h).
      imagePullSecrets:
        - name: ecr-pull-secret
      containers:
        - name: {{ include "secure-cloud-pipeline.name" . }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 5000
          env:
            - name: APP_SECRET_MESSAGE
              value: {{ .Values.app.secretMessage | quote }}
            - name: SECRETS_MANAGER_SECRET_NAME
              value: {{ .Values.secretsManager.secretName | quote }}
            - name: AWS_REGION
              value: {{ .Values.awsRegion | quote }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
