apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "secure-cloud-pipeline.fullname" . | trunc 40 | trimSuffix "-" }}-ecr-refresh
  labels:
    {{- include "secure-cloud-pipeline.labels" . | nindent 4 }}
---
# Namespaced Role, not ClusterRole - this only ever needs to touch one
# Secret in the namespace this chart is installed into.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "secure-cloud-pipeline.fullname" . | trunc 40 | trimSuffix "-" }}-ecr-refresh
  labels:
    {{- include "secure-cloud-pipeline.labels" . | nindent 4 }}
rules:
  # RBAC resourceNames can't restrict `create` - there's no existing
  # object yet for the API server to compare the name against - so this
  # verb can only be scoped by resource type + namespace, not by name.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
  # get/update/patch DO support resourceNames, so these are pinned to
  # exactly the one secret this CronJob manages - it can't read or modify
  # any other Secret in the namespace, including the app's own
  # Secrets Manager access (the app doesn't use a Kubernetes Secret for
  # that at all - it reads AWS Secrets Manager directly via boto3).
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["ecr-pull-secret"]
    verbs: ["get", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "secure-cloud-pipeline.fullname" . | trunc 40 | trimSuffix "-" }}-ecr-refresh
  labels:
    {{- include "secure-cloud-pipeline.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "secure-cloud-pipeline.fullname" . | trunc 40 | trimSuffix "-" }}-ecr-refresh
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: {{ include "secure-cloud-pipeline.fullname" . | trunc 40 | trimSuffix "-" }}-ecr-refresh
  apiGroup: rbac.authorization.k8s.io
